databases:
  - name: dzapp-db
    plan: free
    databaseName: dzapp
    user: dzapp

services:
  - type: web
    name: dzapp
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dzapp-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      # Can't be known until the service exists and gets its
      # *.onrender.com URL — fill in from the Render dashboard right
      # after the first deploy (Environment tab), then it'll redeploy
      # automatically. Format: https://<your-service-name>.onrender.com
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_VERSION
        value: 22.22.2

# Notes:
# - Free plan sleeps after inactivity and has no persistent disk, so
#   uploaded listing photos (public/uploads) will NOT survive a redeploy
#   or restart on this plan. Fine for a first look/demo; before real
#   usage, swap the upload route (src/app/api/upload/route.ts) for an
#   S3-compatible object store (Render Disks on a paid plan, or R2/S3).
