services:
  - type: web
    name: dzapp
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      # SQLite file on the service's own disk — chosen because Render
      # allows only one free-tier Postgres per account and this account's
      # is already used by another project. Data (users/listings) does
      # NOT persist across redeploys or restarts on Render's free plan —
      # fine for trying the app out; move to a real Postgres database
      # (see the commented-out block below) before any real usage.
      - key: DATABASE_URL
        value: file:./prod.db
      - key: AUTH_SECRET
        generateValue: true
      # Can't be known until the service exists and gets its
      # *.onrender.com URL — fill in from the Render dashboard right
      # after the first deploy (Environment tab), then it'll redeploy
      # automatically. Format: https://<your-service-name>.onrender.com
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_VERSION
        value: 22.22.2

# Notes:
# - Free plan has no persistent disk, so both the SQLite database and
#   uploaded listing photos (public/uploads) reset on every redeploy or
#   restart. Fine for a first look/demo; before real usage:
#     1. Switch prisma/schema.prisma's datasource back to `postgresql`
#        (see git history — this repo started on Postgres) and uncomment
#        the `databases:` block below, on a paid plan since this account's
#        one free Postgres is already used elsewhere.
#     2. Swap the upload route (src/app/api/upload/route.ts) for an
#        S3-compatible object store (Render Disks on a paid plan, or R2/S3).
#
# databases:
#   - name: dzapp-db
#     plan: starter
#     databaseName: dzapp
#     user: dzapp
