services:
  - type: web
    name: dzapp
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      # Postgres on Neon (external — not Render's own managed Postgres,
      # to avoid a paid plan requirement there). Both the pooled
      # connection (DATABASE_URL, what the app queries through at
      # runtime) and the direct one (DIRECT_URL, what `prisma migrate
      # deploy` needs — PgBouncer's pooled connections don't support
      # the session-level features migrations use) come from the
      # project's Neon dashboard → Connection Details. Set both here
      # manually; never commit real values for these.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      # Signup is invite-only (existing users mint codes from the
      # /invites page). This is the one code that's always valid and
      # never consumed, no matter how empty the database is — including
      # right after the very first deploy, when there are zero users and
      # so no way to mint a real invite at all. Use it to create the
      # first account, then ignore it — see README's "Invite-only
      # signup" section. Render generates a random value; find it in
      # this service's Environment tab.
      - key: BOOTSTRAP_INVITE_CODE
        generateValue: true
      # Can't be known until the service exists and gets its
      # *.onrender.com URL — fill in from the Render dashboard right
      # after the first deploy (Environment tab), then it'll redeploy
      # automatically. Format: https://<your-service-name>.onrender.com
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_VERSION
        value: 22.22.2
      # Password reset emails (Resend — https://resend.com, free tier).
      # Create an account, grab an API key, and set it here. Without
      # it, reset links just get logged server-side instead of emailed.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "DZ APP <onboarding@resend.dev>"

# Notes:
# - The database (Postgres on Neon) now persists across redeploys and
#   restarts — users, listings and jobs survive a `git push`.
# - Uploaded listing photos (./uploads) do NOT persist yet — they're
#   still written to the service's own ephemeral disk, same as before.
#   This is a separate problem from the database and is still open; fix
#   it by swapping the upload route (src/app/api/upload/route.ts) for
#   an S3-compatible object store (R2/S3) before relying on photo
#   uploads for real listings.
